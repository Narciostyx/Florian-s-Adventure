name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect solution
        id: detect
        shell: pwsh
        run: |
          if (Test-Path 'FloriansAdventure.sln') {
            'ready=true' >> $env:GITHUB_OUTPUT
          }
          else {
            'ready=false' >> $env:GITHUB_OUTPUT
            Write-Host 'FloriansAdventure.sln does not exist yet (M00 not applied). Skipping build.'
          }

      - name: Cache vcpkg
        if: steps.detect.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'Directory.Build.props') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Validate manifest
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          if ((Get-Content -Raw 'vcpkg.json') -match 'TODO-REPLACE-WITH-REAL-COMMIT-SHA') {
            throw 'vcpkg.json still contains the placeholder builtin-baseline.'
          }

      # The project builds in manifest mode (VcpkgEnableManifest), so the dependency tree
      # lives in ./vcpkg_installed, not in C:\vcpkg\installed. Without this step nothing
      # ever populates it and the build dies on missing glm/SDL3 headers.
      - name: Install vcpkg dependencies
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md --host-triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }
          # The installed tree nests as vcpkg_installed/<triplet>[/<triplet>]/include depending
          # on whether MSBuild's manifest support or the CLI created it, so search for the
          # headers instead of assuming one layout.
          foreach ($header in 'glm.hpp', 'SDL.h', 'json.hpp') {
            if (-not (Get-ChildItem -Recurse -Path 'vcpkg_installed' -Filter $header -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "vcpkg install finished but no $header exists under vcpkg_installed"
            }
          }

      # MSBuild's VS-bundled vcpkg SDK resolver does not engage on the GitHub runner, so
      # the manifest auto-install never fires (no "Building a vcpkg tree" in any log).
      # `integrate install` writes the user-wide vcpkg.props that inject the include/lib
      # directories, and it resolves the same `vcpkg_installed/<triplet>` layout the CLI
      # install above produces.
      - name: Integrate vcpkg with MSBuild
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { throw "vcpkg integrate install failed: $LASTEXITCODE" }

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1)
          if (-not $msbuild) { throw 'MSBuild.exe not found.' }
          # VcpkgRoot is passed explicitly: the runner has no user-wide `vcpkg integrate
          # install`, and MSBuild's built-in manifest support needs to locate the root.
          & $msbuild FloriansAdventure.sln /m /nologo /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 "/p:VcpkgRoot=$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Test
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_tests.exe'
          if (-not (Test-Path $exe)) { throw "Test executable missing: $exe" }
          & $exe 2>&1 | Tee-Object -FilePath 'test-${{ matrix.configuration }}.log'
          if ($LASTEXITCODE -ne 0) { throw "Tests failed: $LASTEXITCODE" }

      - name: Scripted smoke
        if: steps.detect.outputs.ready == 'true'
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_app.exe'
          & $exe --frames 60 2>&1 | Tee-Object -FilePath 'frames-${{ matrix.configuration }}.log'
          if ($LASTEXITCODE -ne 0) { throw "Scripted smoke failed: $LASTEXITCODE" }

      # The runners have no GPU, so Windows only offers the generic opengl32 (GL 1.1) and
      # the engine's function table rejects it: "render init failed ... continuing without
      # rendering". Assets and the scene come up only after a renderer exists, so
      # --play-test, --soak and the resolution run cannot verify anything in that state.
      # Detect it once and let the three GL-dependent steps report as skipped instead of
      # pretending a headless run exercised gameplay.
      - name: Probe OpenGL
        if: steps.detect.outputs.ready == 'true'
        id: probe
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_app.exe'
          $log = 'probe-${{ matrix.configuration }}.log'
          & $exe --frames 2 2>&1 | Tee-Object -FilePath $log | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "OpenGL probe failed: $LASTEXITCODE" }
          $gl = -not (Select-String -Path $log -Pattern 'continuing without rendering' -Quiet)
          "gl=$($gl.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "OpenGL usable: $gl"

      - name: Play smoke
        if: steps.detect.outputs.ready == 'true' && steps.probe.outputs.gl == 'true'
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_app.exe'
          & $exe --play-test 2>&1 | Tee-Object -FilePath 'play-${{ matrix.configuration }}.log'
          if ($LASTEXITCODE -ne 0) { throw "Play smoke failed: $LASTEXITCODE" }

      - name: Soak (simulated 20 s)
        if: steps.detect.outputs.ready == 'true' && steps.probe.outputs.gl == 'true'
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_app.exe'
          & $exe --soak 20 2>&1 | Tee-Object -FilePath 'soak-${{ matrix.configuration }}.log'
          if ($LASTEXITCODE -ne 0) { throw "Soak failed: $LASTEXITCODE" }

      - name: 1080p smoke
        if: steps.detect.outputs.ready == 'true' && steps.probe.outputs.gl == 'true'
        shell: pwsh
        run: |
          $exe = 'build\bin\x64\${{ matrix.configuration }}\fa_app.exe'
          & $exe --resolution 1920x1080 --frames 5 2>&1 |
            Tee-Object -FilePath 'hd-${{ matrix.configuration }}.log'
          if ($LASTEXITCODE -ne 0) { throw "1080p smoke failed: $LASTEXITCODE" }

      # Keeps the skip visible instead of silently green: the job still succeeds, but the
      # run carries a warning that gameplay was not exercised.
      - name: Note skipped GL smoke
        if: steps.detect.outputs.ready == 'true' && steps.probe.outputs.gl != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::No usable OpenGL context on this runner - Play smoke, Soak and 1080p smoke were skipped. Gameplay and save round trips are only verified locally (fa_app --play-test)."

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.configuration }}
          path: |
            test-${{ matrix.configuration }}.log
            frames-${{ matrix.configuration }}.log
            play-${{ matrix.configuration }}.log
            soak-${{ matrix.configuration }}.log
            hd-${{ matrix.configuration }}.log
          if-no-files-found: ignore

  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format check
        shell: pwsh
        run: |
          pip install clang-format==18.1.8 --quiet
          python scripts/check-format.py
          if ($LASTEXITCODE -ne 0) { throw "Formatting check failed: $LASTEXITCODE" }
